<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TC002 Emulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
        }

        h1 {
            color: #e0e0e0;
            margin-bottom: 4px;
            font-size: 24px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 20px;
            font-size: 12px;
        }

        .container {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .led-matrix {
            display: grid;
            grid-template-columns: repeat(52, 1fr);
            grid-template-rows: repeat(16, 1fr);
            gap: 1px;
            background: #1a1a2e;
            padding: 6px;
            border-radius: 6px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .led {
            width: 6px;
            height: 6px;
            border-radius: 1px;
            background: #0f0f1a;
            transition: background-color 0.05s ease;
        }

        /* Hardware Status Panel */
        .hw-status {
            background: #1a1a2e;
            border-radius: 6px;
            padding: 12px;
            font-size: 11px;
        }

        .hw-status .title {
            color: #888;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .hw-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #2a2a4e;
        }

        .hw-row:last-child {
            border-bottom: none;
        }

        .hw-label {
            color: #666;
        }

        .hw-value {
            color: #e0e0e0;
        }

        .hw-value.on {
            color: #4ade80;
        }

        .hw-value.error {
            color: #ef4444;
        }

        .hw-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
            margin-right: 6px;
        }

        .hw-indicator.on {
            background: #4ade80;
            box-shadow: 0 0 6px #4ade80;
        }

        .hw-indicator.error {
            background: #ef4444;
            box-shadow: 0 0 6px #ef4444;
        }

        .mic-bar {
            width: 80px;
            height: 6px;
            background: #2a2a4e;
            border-radius: 3px;
            overflow: hidden;
        }

        .mic-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #f59e0b);
            transition: width 0.1s;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel {
            background: #1a1a2e;
            border-radius: 6px;
            padding: 14px;
        }

        .panel-title {
            color: #888;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            background: #0f0f1a;
            border: 1px solid #2a2a4e;
            color: #e0e0e0;
            padding: 8px 10px;
            border-radius: 3px;
            font-family: inherit;
            font-size: 12px;
            min-width: 120px;
        }

        select {
            background: #0f0f1a;
            border: 1px solid #2a2a4e;
            color: #e0e0e0;
            padding: 8px 10px;
            border-radius: 3px;
            font-family: inherit;
            font-size: 12px;
        }

        button {
            background: #2a2a4e;
            color: #e0e0e0;
            border: 1px solid #3a3a6e;
            padding: 8px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            transition: all 0.2s;
        }

        button:hover {
            background: #3a3a6e;
            border-color: #4a4a8e;
        }

        button.primary {
            background: #4a4a8e;
            border-color: #5a5a9e;
        }

        button.primary:hover {
            background: #5a5a9e;
        }

        .drop-zone {
            border: 2px dashed #3a3a6e;
            border-radius: 4px;
            padding: 16px;
            text-align: center;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 11px;
        }

        .drop-zone:hover, .drop-zone.drag-over {
            border-color: #4a4a8e;
            background: #2a2a4e;
        }

        .drop-zone.active {
            border-color: #4ade80;
        }

        .slider-group {
            margin-bottom: 10px;
        }

        .slider-group label {
            color: #888;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #2a2a4e;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4a4a8e;
            cursor: pointer;
        }

        .status {
            color: #666;
            font-size: 10px;
            margin-top: 8px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>TC002 Emulator</h1>
    <div class="subtitle">52×16 RGB LED Matrix with Hardware Status</div>

    <div class="container">
        <div class="left-panel">
            <div class="led-matrix" id="matrix"></div>

            <!-- Hardware Status -->
            <div class="hw-status">
                <div class="title">Hardware Status</div>
                <div class="hw-row">
                    <span class="hw-label">MCU</span>
                    <span class="hw-value">
                        <span class="hw-indicator" id="mcuIndicator"></span>
                        <span id="mcuStatus">Connected</span>
                    </span>
                </div>
                <div class="hw-row">
                    <span class="hw-label">MCU Ver</span>
                    <span class="hw-value" id="mcuVersion">v1.0.2</span>
                </div>
                <div class="hw-row">
                    <span class="hw-label">WiFi</span>
                    <span class="hw-value">
                        <span class="hw-indicator on" id="wifiIndicator"></span>
                        <span class="on" id="wifiStatus">Connected</span>
                    </span>
                </div>
                <div class="hw-row">
                    <span class="hw-label">BLE</span>
                    <span class="hw-value">
                        <span class="hw-indicator" id="bleIndicator"></span>
                        <span id="bleStatus">Advertising</span>
                    </span>
                </div>
                <div class="hw-row">
                    <span class="hw-label">MIC Level</span>
                    <span class="hw-value">
                        <div class="mic-bar">
                            <div class="mic-bar-fill" id="micBar" style="width: 0%"></div>
                        </div>
                        <span id="micValue">0%</span>
                    </span>
                </div>
                <div class="hw-row">
                    <span class="hw-label">Knob</span>
                    <span class="hw-value" id="knobStatus">Idle</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <!-- Text -->
            <div class="panel">
                <div class="panel-title">Text Display</div>
                <div class="row">
                    <input type="text" id="textInput" placeholder="Text..." value="HELLO">
                    <select id="textColor">
                        <option value="#3b82f6">Blue</option>
                        <option value="#00c8b4">Teal</option>
                        <option value="#f59e0b">Amber</option>
                        <option value="#ef4444">Red</option>
                        <option value="#a855f7">Purple</option>
                        <option value="#ffffff">White</option>
                    </select>
                </div>
                <div class="row" style="margin-top: 8px;">
                    <button onclick="window.emulator.displayText('static')">Static</button>
                    <button onclick="window.emulator.displayText('scroll')">Scroll</button>
                    <button onclick="window.emulator.displayText('blink')">Blink</button>
                </div>
            </div>

            <!-- Image -->
            <div class="panel">
                <div class="panel-title">Image Display</div>
                <div class="drop-zone" id="dropZone">
                    Drop image or click
                </div>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                <div class="row" style="margin-top: 8px;">
                    <button onclick="window.emulator.loadSampleImage('gradient')">Gradient</button>
                    <button onclick="window.emulator.loadSampleImage('checker')">Checker</button>
                    <button onclick="window.emulator.loadSampleImage('smile')">Smile</button>
                </div>
            </div>

            <!-- Effects -->
            <div class="panel">
                <div class="panel-title">Effects & Animation</div>
                <div class="slider-group">
                    <label><span>Brightness</span><span id="brightnessValue">100%</span></label>
                    <input type="range" id="brightness" min="10" max="200" value="100">
                </div>
                <div class="row">
                    <button onclick="window.emulator.startAnimation('rainbow')">Rainbow</button>
                    <button onclick="window.emulator.startAnimation('wave')">Wave</button>
                    <button onclick="window.emulator.startAnimation('matrix')">Matrix</button>
                    <button onclick="window.emulator.startAnimation('fire')">Fire</button>
                    <button onclick="window.emulator.startAnimation('snow')">Snow</button>
                    <button onclick="window.emulator.stopAnimation()" class="primary">Stop</button>
                </div>
            </div>

            <!-- Hardware Simulation -->
            <div class="panel">
                <div class="panel-title">Hardware Simulation</div>
                <div class="row">
                    <button onclick="window.emulator.simulateMic()">Test MIC</button>
                    <button onclick="window.emulator.toggleWifi()">Toggle WiFi</button>
                    <button onclick="window.emulator.toggleBle()">Toggle BLE</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
